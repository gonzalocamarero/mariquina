<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D6124" />
      <stop offset="100%" stop-color="#2D3B14" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E6CE" />
      <stop offset="100%" stop-color="#CBB178" />
    </linearGradient>
  </defs>

  <!-- Fondo verde oliva con esquinas redondeadas suaves -->
  <rect width="512" height="512" rx="114" fill="url(#bgGrad)" />

  <!-- Reborde sutil dorado/champagne -->
  <rect x="20" y="20" width="472" height="472" rx="94" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-opacity="0.6" />

  <!-- M clásica con serif de alta legibilidad -->
  <text x="50%" y="52%" dominant-baseline="central" text-anchor="middle" font-family="Georgia, 'Cormorant Garamond', serif" font-size="330" font-weight="bold" fill="#FCFBF9">M</text>
</svg>
